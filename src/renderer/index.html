<!doctype html>
<html lang="zh-TW" class="dark" data-accent="violet" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer never loads remote content, so the CSP is maximally strict.
      'unsafe-inline' is required for style because Tailwind and the progress
      bars set inline styles; scripts have no such exemption.

      `blob:` is in `img-src` for the wallpaper, and only for that: the picture
      reaches CSS as a `blob:` URL built in this process from the bytes the main
      process read. It cannot be the data URL, because a CSS declaration over 2 MiB
      is dropped without a word — a normal photo is bigger than that, and the
      window simply showed no picture (see `@shared/wallpaper-url`). A blob URL
      cannot be conjured by remote content either: it can only be created by a
      script already running in this window.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>AriaDM</title>
  </head>
  <body>
    <!-- The wallpaper layer. It stays in the markup rather than being created by
         script so the picture is already painted when React mounts, and it is
         inert: no pointer events, no layout. -->
    <div id="app-wallpaper" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
