<!doctype html>
<html lang="zh-TW" class="dark" data-accent="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The catch popup is a second document, so it needs its own copy of the
      renderer's CSP. Same rules as index.html: no remote content is ever loaded.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>AriaDM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/catcher.tsx"></script>
  </body>
</html>
