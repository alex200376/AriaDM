<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AriaDM</title>
    <style>
      /*
       * The popup is a status line, the current page, and two buttons.
       *
       * It used to be five stacked boxes of near-equal weight — a login card, a
       * capture card, a discovery card — which made a two-button tool look like a
       * settings page. Anything that is not part of the common path now sits in
       * the footer or behind the disclosure.
       *
       * The palette follows the browser's own preference. The dark values are the
       * default (they were the only ones for a long time), and the light block
       * below overrides the same custom properties, so the layout is untouched.
       */
      :root {
        color-scheme: dark;
        --bg: #14161c;
        --surface: #1a1d25;
        --line: #272b35;
        --fg: #e7e9ef;
        --muted: #9aa2b1;
        --faint: #6b7382;
        --brand: #7c6cf5;
        --ok: #3ec98a;
        --danger: #f2695c;
        --warn: #e0b34f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #ffffff;
          --surface: #f6f7f9;
          --line: #e3e6ec;
          --fg: #1b1e24;
          --muted: #565d6b;
          --faint: #838a98;
          /* A touch darker than the dark-theme violet: the same value reads as
             washed out as a button on white. */
          --brand: #6a58f0;
          --ok: #1f9d63;
          --danger: #cf4436;
          --warn: #8a6100;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--fg);
        font: 12.5px/1.5 -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      h1 { margin: 0; font-size: 13.5px; font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
      .dot.ok { background: var(--ok); }
      .dot.bad { background: var(--danger); }
      .status { margin-left: auto; font-size: 11px; color: var(--muted); }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 10px;
        margin-bottom: 8px;
      }
      /* One line: the label and its switch, nothing else. */
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .row .card-title { min-width: 0; }
      .card-title { font-size: 12px; }
      .hint { font-size: 10.5px; line-height: 1.45; color: var(--faint); margin-top: 2px; }

      /* The current page, on one line: the host matters, the full URL is noise. */
      .page-url {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .page-state { margin-top: 5px; font-size: 11px; line-height: 1.45; color: var(--faint); }
      .page-state.ready { color: var(--ok); }
      .page-state.blocked { color: var(--warn); }

      .actions { display: flex; gap: 8px; margin-bottom: 8px; }
      button {
        border: 0;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 0 10px;
        height: 32px;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      .primary { background: var(--brand); color: #fff; flex: 2; }
      .secondary { background: var(--line); color: var(--fg); flex: 1; }
      .ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        height: 28px;
        font-weight: 500;
        flex: 1;
      }
      .ghost:hover { color: var(--fg); }

      /* The quality menu, only shown when the page offers more than one. */
      /* Capped so a long list cannot push the buttons off the popup. */
      .formats {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 5px;
        margin-bottom: 8px;
        max-height: 236px;
        overflow-y: auto;
      }
      .formats[hidden] { display: none; }
      .formats-title {
        font-size: 10.5px;
        color: var(--faint);
        padding: 3px 6px 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .format {
        display: block;
        width: 100%;
        height: auto;
        padding: 5px 6px;
        text-align: left;
        background: transparent;
        border-radius: 7px;
      }
      .format:hover { background: rgba(124, 108, 245, 0.22); }
      .format-name { display: block; font-size: 12px; font-weight: 600; }
      .format-note { display: block; font-size: 10.5px; font-weight: 400; color: var(--faint); }

      .switch { position: relative; width: 34px; height: 19px; flex: none; }
      .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--line);
        transition: background 120ms;
        pointer-events: none;
      }
      .switch span::after {
        content: "";
        position: absolute;
        top: 2.5px;
        left: 2.5px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--fg);
        transition: transform 120ms;
      }
      .switch input:checked + span { background: var(--brand); }
      .switch input:checked + span::after { transform: translateX(15px); }

      .footer { display: flex; gap: 6px; }

      .advanced { margin-top: 8px; }
      .advanced summary { font-size: 10.5px; color: var(--faint); cursor: pointer; }
      .advanced .hint { margin-top: 6px; }
      .advanced input {
        width: 100%;
        height: 28px;
        padding: 0 8px;
        margin-top: 6px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        font-size: 11.5px;
      }
      .advanced input:focus { outline: none; border-color: var(--brand); }
      .advanced button { width: 100%; margin-top: 6px; }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot"></span>
      <h1>AriaDM</h1>
      <span id="status" class="status"></span>
    </header>

    <div class="card">
      <div class="page-url" id="currentPage">—</div>
      <div class="page-state" id="pageState"></div>
    </div>

    <div class="actions">
      <button id="sendVideo" class="primary"></button>
      <button id="sendLinks" class="secondary"></button>
    </div>

    <div class="formats" id="formats" hidden>
      <div class="formats-title" id="formatsTitle"></div>
    </div>

    <div class="card row">
      <span class="card-title" id="interceptLabel"></span>
      <label class="switch">
        <input type="checkbox" id="autoIntercept" />
        <span></span>
      </label>
    </div>

    <div class="footer">
      <button id="reconnect" class="ghost"></button>
    </div>

    <details class="advanced">
      <summary id="advancedSummary"></summary>
      <div class="hint" id="advancedHint"></div>
      <!--
        Proactive cookie push lives here rather than in the footer: the background
        worker already answers AriaDM's own requests, so this button is only the
        manual escape hatch for a browser whose cookie store yt-dlp cannot read.
      -->
      <button id="sendCookies" class="ghost"></button>
      <input type="number" id="port" min="1" max="65535" />
      <input type="text" id="token" />
      <button id="save" class="ghost"></button>
    </details>

    <script src="strings.js"></script>
    <script src="pairing.js"></script>
    <script src="urls.js"></script>
    <script src="formats.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
